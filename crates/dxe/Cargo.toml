[package]
name = "svmvisor-dxe"
version.workspace = true
edition.workspace = true

[[bin]]
name = "svmvisor-dxe"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
memory-attribute-provider = ["dep:svmvisor-memory-attributes"]
memory-attribute-firmware = ["memory-attribute-provider"]
memory-attribute-probe = ["memory-attribute-firmware"]
memory-attribute-f7 = ["memory-attribute-provider", "native-preflight"]
native-preflight = []
native-resident = ["native-preflight"]
native-resident-test = ["native-resident"]
native-resident-smp-prepare = ["native-resident-test"]
native-resident-smp-activate = ["native-resident"]
native-resident-guest-startup = ["native-resident-smp-activate"]
native-resident-boot = ["native-resident-guest-startup"]
# Explicit platform test: firmware must satisfy a runtime allocation below 1GiB.
native-resident-low-runtime = ["native-resident-boot"]
native-resource-observe = ["native-preflight"]
native-returning = ["native-resource-observe", "memory-attribute-f7"]
native-transition-test = ["native-preflight"]
native-transition-roundtrip = ["native-transition-test"]
native-transition-event-test = ["native-transition-test"]
native-transition-canary-negative = ["native-transition-test"]
native-transition-multi-exit = ["native-transition-test"]
native-transition-multi-exit-unexpected = ["native-transition-multi-exit"]
native-transition-multi-exit-mismatch = ["native-transition-multi-exit"]
native-transition-multi-exit-bad-mode = ["native-transition-multi-exit"]
card-load-only = ["dep:svmvisor-firmware-handoff", "dep:sha2"]
card-returning-loader = ["dep:sha2"]
# Shared resident-loader code. Select exactly one of the two loaders below.
card-resident = ["dep:sha2"]
# Production: the exact 128-byte payload header is compiled in (SVMVISOR_CARD_PE_HEADER).
card-resident-loader = ["card-resident"]
# Development: trust the structurally valid header found in the card's payload
# slot; the child is still bound to that header's SHA-256. Owner's bench only.
card-resident-dev-loader = ["card-resident"]

[dependencies]
svmvisor-card-abi = { path = "../card-abi" }
svmvisor-memory-attributes = { path = "../memory-attributes", optional = true }
svmvisor-hypervisor = { path = "../hypervisor" }

uefi-raw = "0.15.1"
sha2 = { version = "0.11", default-features = false, optional = true }
svmvisor-firmware-handoff = { path = "../firmware-handoff", optional = true }

