[package]
name = "svmvisor-hypervisor"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
x86_64.workspace = true

[features]
resident-runtime = []
resident-runtime-test = ["resident-runtime"]
# Disposable QEMU survey model; deliberately absent from every native profile.
native-cache-survey-fixture = []
native-cache-survey-mismatch = ["native-cache-survey-fixture"]
native-cache-survey-drift = ["native-cache-survey-fixture"]

