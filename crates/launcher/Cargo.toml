[package]
name = "svmvisor-launcher"
version.workspace = true
edition.workspace = true

[[bin]]
name = "svmvisor-launcher"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
native-preflight = []
native-resident = ["native-preflight"]
native-resident-test = ["native-resident"]
native-resident-smp-prepare = ["native-resident-test"]
native-resident-smp-activate = ["native-resident"]
native-resident-guest-startup = ["native-resident-smp-activate"]
native-resident-boot = ["native-resident-guest-startup"]
# Explicit platform test: firmware must satisfy a runtime allocation below 1GiB.
native-resident-low-runtime = ["native-resident-boot"]

[dependencies]
svmvisor-card-abi = { path = "../card-abi" }
svmvisor-hypervisor = { path = "../hypervisor" }

uefi-raw = "0.15.1"

