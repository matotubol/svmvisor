[package]
name = "svmvisor-native-preflight-test"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
attribute-fixture = []
attribute-read-denied = ["attribute-fixture"]
boundary-call = ["attribute-fixture"]
boundary-sse = ["boundary-call"]
boundary-avx = ["boundary-call"]
boundary-xcr0-refused = ["boundary-call"]

[dependencies]
uefi-raw = "=0.15.1"
uefi = { version = "=0.39.0", default-features = false }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
