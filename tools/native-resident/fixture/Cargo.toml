[package]
name = "svmvisor-native-resident-fixture"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[[bin]]
name = "BOOTX64"
path = "src/main.rs"
test = false
bench = false

[dependencies]
uefi = { version = "=0.39.0", default-features = false }
uefi-raw = "=0.15.1"
svmvisor-dxe = { path = "../../../crates/dxe", default-features = false, features = ["native-preflight"], optional = true }

[features]
expect-rejection = []
smp-prepare = ["runtime-time"]
smp-activate = ["dep:svmvisor-dxe", "runtime-time"]
guest-startup = ["smp-activate"]
loader-boot = ["guest-startup", "virtual-map"]
loader-new-root = ["loader-boot"]
cache-survey = ["loader-new-root"]
guest-paging-avl = ["loader-new-root"]
guest-vmcr = ["loader-new-root"]
guest-cpuid-nrip = ["loader-new-root"]
guest-msr-nrip = ["guest-vmcr"]
guest-startup-broadcast = ["loader-new-root"]
guest-cache = ["loader-new-root"]
guest-cache-low = ["guest-cache"]
guest-cache-cr0 = ["guest-cache"]
guest-cache-init = ["guest-cache"]
guest-cache-hwcr = ["guest-cache"]
guest-apic-pke = ["loader-new-root", "guest-xapic"]
guest-apic-contract = ["loader-new-root"]
loader-fsgsbase = ["loader-new-root"]
loader-controls = ["loader-fsgsbase"]
guest-xapic = ["guest-startup"]
guest-xapic-upgrade = ["guest-xapic"]
guest-irq-wakeup = ["guest-startup"]
guest-irq-level = ["guest-irq-wakeup"]
guest-irq-reset-refusal = ["guest-irq-wakeup"]
guest-terminal-await = ["guest-startup"]
smp-reject-init = ["smp-activate"]
smp-reject-sipi = ["smp-activate"]
smp-reject-remote-init = ["smp-activate"]
smp-reject-apic-mode = ["smp-activate"]
runtime-time = []
virtual-map = ["runtime-time"]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
