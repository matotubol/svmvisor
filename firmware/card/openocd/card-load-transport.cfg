# Only used by the separately gated card-load-test.ps1 operation.
if {![info exists SESSION]} { error "SESSION is required" }
interface ftdi
ftdi_vid_pid 0x0403 0x6011
ftdi_channel 0
ftdi_layout_init 0x0098 0x008b
reset_config none
adapter_khz 1000
# Exact device, unlike the upstream helper's broad list of accepted parts.
jtag newtap xc7 tap -irlen 6 -expected-id 0x0362d093
pld device virtex2 xc7.tap 1
target create xc7.proxy testee -chain-position xc7.tap
flash bank xc7.spi jtagspi 0 0 0 0 xc7.proxy 0x02
init
if {[jtag cget xc7.tap -idcode] != 0x0362d093} { error "Wrong FPGA ID" }
pld load 0 [file join $SESSION proxy.bit]
reset halt
flash probe xc7.spi
# The command returns sector text; capture only collects logs and loses it.
set details [flash info xc7.spi sectors]
if {![regexp -nocase {Device 'issi is25lp256d' \(ID 0x0019609d\)} $details]} {
    error "Wrong or unrecognized flash identity"
}
set banks [flash list]
if {[llength $banks] != 1} { error "Expected one flash bank" }
array set geometry [lindex $banks 0]
if {![info exists geometry(size)] || ![info exists geometry(base)] ||
    $geometry(size) != 33554432 || $geometry(base) != 0} {
    error "Wrong flash geometry"
}
set sectors [regexp -all -inline -line -nocase {^[\t ]*#\s*([0-9]+): 0x([0-9a-f]+) \(0x([0-9a-f]+) 64kB\)} $details]
if {[llength $sectors] != 2048} { error "Expected512 identified64KiB erase sectors" }
for {set i 0} {$i < 512} {incr i} {
    set n [expr {$i * 4}]
    scan [lindex $sectors [expr {$n + 2}]] %x offset
    scan [lindex $sectors [expr {$n + 3}]] %x size
    if {[lindex $sectors [expr {$n + 1}]] != $i || $offset != $i * 65536 || $size != 65536} {
        error "Unexpected erase-sector layout"
    }
}
echo "PASS card-target-id-and-geometry"
