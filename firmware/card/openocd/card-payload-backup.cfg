# Payload-slot-only backup for flash-card.ps1 -Action ProgramPayload/RestorePayload.
# Reads flash [0x400000,0x500000) twice. Contains no erase or write command.
if {![info exists SESSION]} { error "SESSION is required" }
if {![info exists ADAPTER_KHZ] || ![regexp {^[1-9][0-9]*$} $ADAPTER_KHZ] ||
    $ADAPTER_KHZ < 100 || $ADAPTER_KHZ > 30000} { error "ADAPTER_KHZ must be a decimal integer within 100..30000" }
foreach name {slot-before-a.bin slot-before-b.bin} {
    if {[file exists [file join $SESSION $name]]} { error "Slot backup output already exists" }
}
# Identify the FPGA, flash and sector geometry at the proven 1000 kHz first.
source [file join $SESSION transport.cfg]
adapter speed $ADAPTER_KHZ
echo "PASS card-payload-adapter-khz $ADAPTER_KHZ"
flash read_bank xc7.spi [file join $SESSION slot-before-a.bin] 4194304 1048576
flash read_bank xc7.spi [file join $SESSION slot-before-b.bin] 4194304 1048576
echo "PASS card-payload-double-backup"
shutdown
