# Payload-slot-only erase/write for flash-card.ps1 -Action ProgramPayload/RestorePayload.
# Every erase and write is confined to 64 KiB sectors 64..79 = [0x400000,0x500000).
# The FPGA configuration bitstream below 0x400000 is never addressed.
if {![info exists SESSION]} { error "SESSION is required" }
if {![info exists ADAPTER_KHZ] || ![regexp {^[1-9][0-9]*$} $ADAPTER_KHZ] ||
    $ADAPTER_KHZ < 100 || $ADAPTER_KHZ > 30000} { error "ADAPTER_KHZ must be a decimal integer within 100..30000" }
if {![info exists PAYLOAD_ERASE_SECTORS] || ![info exists PAYLOAD_WRITE_SECTORS]} { error "Sector lists are required" }
# Decimal sector numbers only, strictly ascending, all inside the payload slot.
proc payload_sector_list {name value} {
    if {![regexp {^[0-9 ]*$} $value]} { error "$name must contain only decimal sector numbers" }
    set previous 63
    foreach sector $value {
        if {![regexp {^[1-9][0-9]$} $sector] || $sector < 64 || $sector > 79 || $sector <= $previous} {
            error "$name: sector outside payload slot sectors 64..79, or not ascending"
        }
        set first [expr {$sector * 65536}]
        if {$first < 0x400000 || $first + 65536 > 0x500000} { error "$name: sector escapes 0x400000..0x4fffff" }
        set previous $sector
    }
    return $value
}
set erase_sectors [payload_sector_list PAYLOAD_ERASE_SECTORS $PAYLOAD_ERASE_SECTORS]
set write_sectors [payload_sector_list PAYLOAD_WRITE_SECTORS $PAYLOAD_WRITE_SECTORS]
if {[llength $erase_sectors] + [llength $write_sectors] == 0} { error "Nothing to program" }
foreach name {slot-before-a.bin slot-before-b.bin slot-expected.bin} {
    if {![file exists [file join $SESSION $name]] || [file size [file join $SESSION $name]] != 1048576} {
        error "Missing or wrong-sized checked slot input"
    }
}
foreach sector $write_sectors {
    set image [file join $SESSION sector-$sector.bin]
    if {![file exists $image] || [file size $image] != 65536} { error "Missing or wrong-sized sector image" }
}
if {[file exists [file join $SESSION slot-readback.bin]]} { error "Slot readback already exists" }
echo "PASS card-payload-range-confined"
# Identify the FPGA, flash and sector geometry at the proven 1000 kHz first.
source [file join $SESSION transport.cfg]
adapter speed $ADAPTER_KHZ
echo "PASS card-payload-adapter-khz $ADAPTER_KHZ"
# Fail before any erase if the slot no longer contains the checked backup.
flash verify_bank xc7.spi [file join $SESSION slot-before-a.bin] 4194304
echo "PASS card-payload-prewrite-backup-verified"
foreach sector $erase_sectors {
    flash erase_sector xc7.spi $sector $sector
}
foreach sector $write_sectors {
    flash write_bank xc7.spi [file join $SESSION sector-$sector.bin] [expr {$sector * 65536}]
}
# The host compares this complete 1 MiB readback with the expected slot image.
flash read_bank xc7.spi [file join $SESSION slot-readback.bin] 4194304 1048576
echo "PASS card-payload-program-readback"
# No JPROGRAM/JSTART, reset-to-configuration, or activation command.
shutdown
