source [file join $SESSION transport.cfg]
foreach name {before-a.bin before-b.bin} {
    if {[file exists [file join $SESSION $name]]} { error "Backup output already exists" }
}
flash read_bank xc7.spi [file join $SESSION before-a.bin] 0 5242880
flash verify_bank xc7.spi [file join $SESSION before-a.bin] 0
flash read_bank xc7.spi [file join $SESSION before-b.bin] 0 5242880
echo "PASS card-double-backup"
shutdown
