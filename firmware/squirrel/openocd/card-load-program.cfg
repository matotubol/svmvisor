source [file join $SESSION transport.cfg]
foreach name {before-a.bin before-b.bin combined.bin} {
    if {![file exists [file join $SESSION $name]] || [file size [file join $SESSION $name]] != 5242880} {
        error "Missing or wrong-sized checked input"
    }
}
if {[file exists [file join $SESSION readback.bin]]} { error "Readback already exists" }
# Fail before erase if the selected card no longer contains the checked backup.
flash verify_bank xc7.spi [file join $SESSION before-a.bin] 0
echo "PASS card-prewrite-backup-verified"
# Explicit binary type and exact5MiB input restrict erase/write to80 sectors.
flash write_image erase [file join $SESSION combined.bin] 0 bin
flash verify_bank xc7.spi [file join $SESSION combined.bin] 0
flash read_bank xc7.spi [file join $SESSION readback.bin] 0 5242880
echo "PASS card-program-readback"
# No JPROGRAM/JSTART, reset-to-configuration, or activation command.
shutdown
