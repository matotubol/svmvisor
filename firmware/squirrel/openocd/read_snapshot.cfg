# Read-only USER2 path. Deliberately contains no programming helper or proxy.
adapter driver ftdi
ftdi_vid_pid 0x0403 0x6011
ftdi_channel 0
ftdi_layout_init 0x0098 0x008b
reset_config none
adapter speed 1000
jtag newtap xc7 tap -irlen 6 -expected-id 0x0362d093
init
irscan xc7.tap 0x03
# Initial scans deliver the board-clock mailbox into the gated scan domain.
# Bound the attempt even if the device has no snapshot implementation.
for {set n 0} {$n < 12} {incr n} {
    echo "SNAPSHOT:[drscan xc7.tap 512 0]"
    sleep 10
}
# USER3 reads only bounded FPGA diagnostic banks; TDI is a six-bit selector.
# UG470 v1.17 Table10-2: USER3=100010. Repeat for CDC/selector pipeline.
irscan xc7.tap 0x22
# Pass the Tcl integer directly. Bare hexadecimal such as35 is parsed by
# this OpenOCD build as decimal35, not bank0x35; a..f were parsed aszero.
for {set bank 0} {$bank < 64} {incr bank} {
    echo "CPU_REQUEST:$bank"
    for {set n 0} {$n < 5} {incr n} {
        echo "CPU_SNAPSHOT:[drscan xc7.tap 1024 $bank]"
        sleep 2
    }
}
shutdown
