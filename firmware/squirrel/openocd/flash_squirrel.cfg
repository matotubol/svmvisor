if {![info exists BSCAN_FILE]} {
    error "BSCAN_FILE must point to the XC7A35T BSCAN-SPI proxy bitstream"
}
if {![info exists FPGAIMAGE]} {
    error "FPGAIMAGE must point to the .bin image to program"
}
if {![info exists READBACK_FILE] || ![info exists IMAGE_SIZE]} {
    error "READBACK_FILE and IMAGE_SIZE are required for retained readback"
}

interface ftdi
ftdi_vid_pid 0x0403 0x6011
ftdi_channel 0
ftdi_layout_init 0x0098 0x008b
reset_config none

source [find cpld/xilinx-xc7.cfg]
source [find cpld/jtagspi.cfg]
adapter_khz 1000

init
jtagspi_init 0 $BSCAN_FILE
jtagspi_program $FPGAIMAGE 0x0
flash read_bank $_FLASHNAME $READBACK_FILE 0 $IMAGE_SIZE
# Leave the BSCAN proxy loaded. Host SHA-256 validation precedes any activation.
shutdown
