# Exact candidate procedure: preserve and verify the complete predecessor,
# program 80 sectors, verify and retain a complete readback. No activation.
foreach name {known-working.bin combined.bin proxy.bit transport.cfg} {
    if {![file exists [file join $SESSION $name]]} { error "Missing checked input" }
}
foreach name {known-working.bin combined.bin} {
    if {[file size [file join $SESSION $name]] != 5242880} { error "Wrong image size" }
}
foreach name {before-a.bin before-b.bin readback.bin} {
    if {[file exists [file join $SESSION $name]]} { error "Output already exists" }
}
source [file join $SESSION transport.cfg]
flash read_bank xc7.spi [file join $SESSION before-a.bin] 0 5242880
flash read_bank xc7.spi [file join $SESSION before-b.bin] 0 5242880
foreach name {before-a.bin before-b.bin} {
    if {[file size [file join $SESSION $name]] != 5242880} { error "Incomplete backup" }
    flash verify_bank xc7.spi [file join $SESSION $name] 0
}
flash verify_bank xc7.spi [file join $SESSION known-working.bin] 0
echo "PASS card-reviewed-backups-and-predecessor-verified"
echo "BEGIN card-reviewed-write"
flash write_image erase [file join $SESSION combined.bin] 0 bin
flash verify_bank xc7.spi [file join $SESSION combined.bin] 0
flash read_bank xc7.spi [file join $SESSION readback.bin] 0 5242880
echo "PASS card-reviewed-program-readback"
# Leave the volatile BSCAN proxy loaded; do not reconfigure the card.
shutdown
