# Session-bound 5 MiB rollback. Inputs were staged, locked and hashed by restore.ps1.
source [file join $SESSION transport.cfg]
foreach name {before-a.bin before-b.bin rollback-a.bin rollback-b.bin} {
    if {![file exists [file join $SESSION $name]] || [file size [file join $SESSION $name]] != 5242880} {
        error "Missing or wrong-sized checked restore input"
    }
}
if {[file exists [file join $SESSION readback.bin]]} { error "Readback already exists" }
flash verify_bank xc7.spi [file join $SESSION before-a.bin] 0
flash verify_bank xc7.spi [file join $SESSION before-b.bin] 0
echo "PASS card-restore-prewrite-backups-verified"
echo "BEGIN card-reviewed-restore-write"
# Exact 5 MiB at zero: only aligned 64 KiB sectors 0..79.
flash write_image erase [file join $SESSION rollback-a.bin] 0 bin
flash verify_bank xc7.spi [file join $SESSION rollback-a.bin] 0
flash read_bank xc7.spi [file join $SESSION readback.bin] 0 5242880
echo "PASS card-reviewed-restore-readback"
# Leave BSCAN loaded. No JPROGRAM/JSTART, activation or reboot.
shutdown
